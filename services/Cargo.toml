[package]
name = "theos-daemon"
version = "0.1.0"
edition = "2021"
description = "theOS — Satellite-first mobile OS connectivity daemon"
authors = ["theOS Project"]

[[bin]]
name = "theos-daemon"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
opt-level = 3
lto = true
strip = true