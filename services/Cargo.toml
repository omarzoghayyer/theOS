[package]
name = "theos-daemon"
version = "0.1.0"
edition = "2021"
description = "theOS — Satellite-first mobile OS connectivity daemon"
authors = ["theOS Project"]

[[bin]]
name = "theos-daemon"
path = "src/main.rs"

[dependencies]
# Async runtime — essential for network I/O
tokio = { version = "1", features = ["full"] }

# SIP/VoIP (when ready for full SIP stack)
# rsip = "0.4"

# OPUS audio codec
# opus = "0.3"

# ALSA audio (Linux)
# alsa = "0.7"

# Cross-platform audio (alternative to ALSA)
# cpal = "0.15"

# Networking utilities
# socket2 = "0.5"

# Serialization (for config files)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
opt-level = 3
lto = true
strip = true   # Strip debug symbols for smaller binary on device
