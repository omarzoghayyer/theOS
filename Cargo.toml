[workspace]
resolver = "2"
members = [
    "theos-kernel",
    "tools/bootstrap",
  "services",
  "services/cap-broker",
  "tools/capctl",
  "theos-compositor",
  "theos-core",
  "drivers/cs35l41"
]

[profile.dev]
panic = "abort"
debug-assertions = false

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
strip = true
